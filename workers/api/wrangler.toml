# Configuración del Worker de la API de me gusta.
#
# Solo valores PUBLICOS aqui. Los secretos (SUPABASE_SERVICE_ROLE_KEY, VISITOR_HASH_PEPPER)
# se definen con `wrangler secret put` o en .dev.vars. Nunca en este archivo ni en el repositorio.

name = "deus-likes-api"
main = "src/index.js"
compatibility_date = "2026-10-20"
workers_dev = true

[vars]
# Origenes que pueden llamar a la API (lista explicita, separada por comas).
ALLOWED_ORIGINS = "https://deusstellaris-github-io.pages.dev"
# Indice de busqueda publicado: fuente del catalogo de proyectos.
SITE_INDEX_URL = "https://deusstellaris-github-io.pages.dev/search-index.json"
# Indice de demos publicadas: fuente de las demos que admiten resenas.
DEMOS_INDEX_URL = "https://deusstellaris-github-io.pages.dev/demos-index.json"
# URL del proyecto de Supabase. No es secreta: la seguridad depende de RLS y de los secretos.
SUPABASE_URL = "https://bxadgyvcztbpouvuzulx.supabase.co"
# Habilita los endpoints de cuentas de usuario (/accounts/*).
ACCOUNTS_ENABLED = "true"

# Trazas y registros de Workers (exportables a OpenTelemetry desde el panel). Muestreo bajo: las
# peticiones lentas y las muestras RUM se emiten como líneas JSON (ver src/observability.js).
[observability]
enabled = true
head_sampling_rate = 0.1

# Supavisor: SUPABASE_URL usa la API REST (PostgREST), que ya agrupa conexiones. Si se agrega acceso
# SQL directo desde el Worker, usar la cadena "Transaction pooler" (puerto 6543) y nunca la directa.
