<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      CSP propia de /admin. Es más permisiva que la del sitio porque Decap CMS usa estilos
      en línea generados en tiempo de ejecución. Motivo documentado en docs/security/csp.md.
      Scripts: solo el bundle local. Conexiones: solo la API de GitHub. El login usa un popup
      (window.open), así que el Worker de autenticación no necesita estar en connect-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://api.github.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Administración · Deus</title>
  </head>
  <body>
    <!-- Bundle local generado por scripts/sync-decap.mjs (versión fijada). Sin inline. -->
    <script src="vendor/decap-cms-app.js"></script>
  </body>
</html>
